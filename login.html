<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Oluwanjoba Homes</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/globals.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1E1E2F 0%, #4F46E5 100%);
        }

        .auth-card {
            background: white;
            padding: 3rem;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 450px;
            box-shadow: var(--shadow-lg);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header .logo {
            justify-content: center;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: var(--radius);
            outline: none;
            transition: var(--transition);
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .role-btn {
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: var(--radius);
            font-weight: 600;
            color: var(--text-muted);
        }

        .role-btn.active {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(79, 70, 229, 0.05);
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="auth-card">
        <div class="auth-header">
            <a href="index.html" class="logo">
                <i class="fas fa-home-alt"></i> Oluwanjoba <span>Homes</span>
            </a>
            <h2>Welcome Back</h2>
            <p>Login to manage your properties</p>
        </div>

        <div class="role-selector">
            <button class="role-btn active" onclick="setRole('tenant')">Tenant</button>
            <button class="role-btn" onclick="setRole('landlord')">Landlord</button>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-full" style="justify-content: center;">Sign In</button>
        </form>

        <p style="text-align: center; margin-top: 2rem; font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account? <a href="signup.html" style="color: var(--primary); font-weight: 600;">Sign up</a>
        </p>

    </div>

    <script src="js/api.js"></script>
    <script>
        let currentRole = 'tenant';
        function setRole(role) {
            currentRole = role;
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase() === role);
            });
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = e.target.querySelector('input[type="email"]').value;
            const password = e.target.querySelector('input[type="password"]').value;

            try {
                const data = await window.api.login(email, password, currentRole);

                if (data.is_approved) {
                    if (data.role === 'tenant') {
                        window.location.href = 'dashboards/tenant/index.html';
                    } else {
                        window.location.href = 'dashboards/landlord/index.html';
                    }
                } else {
                    window.location.href = 'waiting-approval.html';
                }

            } catch (err) {
                console.error(err);
                alert('Login failed. Please check your credentials.');
            }
        });
    </script>
</body>

</html>
