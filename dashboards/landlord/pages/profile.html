<div class="section-header">
    <div>
        <h2>Landlord Profile</h2>
        <p>Manage your account settings and public profile.</p>
    </div>
</div>

<div class="analytics-card" style="max-width: 800px;">
    <form id="profileForm" onsubmit="event.preventDefault(); alert('Profile updated!')">
        <div class="flex-center" style="margin-bottom: 2rem; flex-direction: column;">
            <img id="profileAvatar" src="https://ui-avatars.com/api/?background=4F46E5&color=fff&name=User&size=128"
                alt="Avatar" style="width: 128px; height: 128px; border-radius: 50%; margin-bottom: 1rem;">
            <button class="btn btn-outline" type="button">Change Avatar</button>
        </div>

        <div class="form-row" style="grid-template-columns: 1fr 1fr;">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="profileName" value="Robert Wilson">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="profileEmail" value="robert@example.com" disabled>
            </div>
        </div>

        <div class="form-group">
            <label>Company Name (Optional)</label>
            <input type=\"text\" placeholder=\"Oluwanjoba Homes Properties\">", "StartLine": 29
        </div>

        <div class="form-group">
            <label>Bio</label>
            <textarea rows="4" placeholder="Tell tenants about yourself..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
