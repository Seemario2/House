<div class="section-header">
    <div>
        <h2>Tenant Applications</h2>
        <p>Review and process applications from potential tenants.</p>
    </div>
</div>

<div class="analytics-card">
    <div class="list-header">
        <h3>Application Management</h3>
        <div class="filter-group">
            <select onchange="Dashboard.filterApplications(this.value)">
                <option value="all">All Status</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="declined">Declined</option>
            </select>
        </div>
    </div>

    <div id="applicationsListContainer">
        <!-- Applications will be injected here -->
        <div class="flex-center" style="padding: 2rem;">
            <i class="fas fa-spinner fa-spin"></i>
        </div>
    </div>
</div>
