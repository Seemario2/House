<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Oluwanjoba Homes</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="../../css/globals.css">
    <link rel="stylesheet" href="../../css/components/dashboard.css">
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="../../index.html" class="logo text-white">
                    <i class="fas fa-shield-alt"></i> Admin
                </a>
                <button class="sidebar-toggle"><i class="fas fa-times"></i></button>
            </div>

            <div class="user-profile-preview">
                <img src="https://ui-avatars.com/api/?name=Admin+User&background=6c5ce7&color=fff" alt="Profile"
                    class="avatar-sm">
                <div class="user-info">
                    <h4 id="userName">Admin User</h4>
                    <span class="badge badge-primary">Administrator</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="blog">
                    <i class="fas fa-newspaper"></i> Blog Manager
                </a>
                <a href="#" class="nav-item" data-page="users" style="opacity: 0.5; cursor: not-allowed;"
                    title="Coming Soon">
                    <i class="fas fa-users"></i> Users
                </a>
                <a href="../../index.html" class="nav-item logout-link"
                    onclick="localStorage.removeItem('user'); localStorage.removeItem('token');">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </nav>
        </aside>

        <!-- Overlay -->
        <div class="sidebar-overlay"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="dashboard-header">
                <button class="sidebar-toggle"><i class="fas fa-bars"></i></button>
                <div class="header-actions">
                    <div class="notifications">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge" style="display: none;">0</span>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-area" id="contentArea">

                <!-- Blog Manager Section -->
                <div id="blogSection">
                    <div class="flex-between mb-4">
                        <h2>Blog Manager</h2>
                        <button class="btn btn-primary" onclick="window.AdminDashboard.openCreateModal()">
                            <i class="fas fa-plus"></i> New Post
                        </button>
                    </div>

                    <div class="card">
                        <div class="table-responsive">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Title</th>
                                        <th>Date</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="blogTableBody">
                                    <tr>
                                        <td colspan="3" class="text-center p-3">Loading posts...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Create Post Modal -->
    <div class="modal" id="createPostModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create New Blog Post</h3>
                <button class="modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="createPostForm">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" name="title" required placeholder="Enter post title">
                    </div>
                    <div class="form-group">
                        <label>Image URL</label>
                        <input type="url" name="image_url" placeholder="https://example.com/image.jpg">
                        <small style="color: var(--text-muted); display: block; margin-top: 0.25rem;">Leave empty for
                            random default</small>
                    </div>
                    <div class="form-group">
                        <label>Content</label>
                        <textarea name="content" required rows="6" placeholder="Write your content here..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-full">Publish Post</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../js/api.js"></script>
    <script src="../../js/shared.js"></script>
    <script src="admin.js"></script>
</body>

</html>
