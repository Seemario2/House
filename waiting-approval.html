<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting for Approval | Oluwanjoba Homes</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/globals.css">
    <!-- Vercel Speed Insights -->
    <script type="module" src="js/speed-insights.js"></script>
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1E1E2F 0%, #4F46E5 100%);
            color: #333;
        }

        .status-card {
            background: white;
            padding: 3rem;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 500px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background: rgba(79, 70, 229, 0.1);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.5rem;
        }

        h2 {
            margin-bottom: 1rem;
            color: var(--text-dark);
        }

        p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
    </style>
</head>

<body>

    <div class="status-card">
        <div class="icon-circle">
            <i class="fas fa-clock"></i>
        </div>
        <h2>Account Pending Approval</h2>
        <p>Thank you for signing up! Your account is currently under review by our administrators.
            You will be notified via email once your account has been approved.</p>

        <div class="actions">
            <a href="index.html" class="btn btn-outline">Back to Home</a>
            <button onclick="logout()" class="btn btn-primary">Logout</button>
        </div>
    </div>

    <script>
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }
    </script>
</body>

</html>
